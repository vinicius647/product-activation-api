# Application + PostgreSQL. The provider mock is the fake provider inside the application (local profile).
# Start with: docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/activation
      SPRING_DATASOURCE_USERNAME: activation
      SPRING_DATASOURCE_PASSWORD: activation
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      PROVIDER_BASE_URL: http://localhost:8080
    deploy:
      resources:
        limits:
          memory: 512m
