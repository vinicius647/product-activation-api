spring:
  application:
    name: product-activation-api
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:productactivation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    # Graceful shutdown: in-flight HTTP requests and provider calls get time to finish.
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 15s

server:
  port: 8080
  shutdown: graceful

app:
  activation:
    scheduler:
      enabled: ${ACTIVATION_SCHEDULER_ENABLED:true}
    dispatch:
      batch-size: ${ACTIVATION_BATCH_SIZE:50}
      fixed-delay: ${ACTIVATION_DISPATCH_DELAY:2s}
    reconciliation:
      fixed-delay: ${ACTIVATION_RECONCILIATION_DELAY:1m}
      stuck-after: ${ACTIVATION_STUCK_AFTER:5m}
    retry:
      max-attempts: ${ACTIVATION_MAX_ATTEMPTS:5}
      initial-backoff: ${ACTIVATION_INITIAL_BACKOFF:2s}
      max-backoff: ${ACTIVATION_MAX_BACKOFF:5m}
      jitter: ${ACTIVATION_RETRY_JITTER:0.2}
  provider:
    # Local default: the fake provider inside this application (local profile).
    base-url: ${PROVIDER_BASE_URL:http://localhost:${server.port}}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:1s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:3s}

logging:
  pattern:
    # Adds the correlation id to every log line.
    level: "%5p [%X{correlationId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      provider:
        base-config: default
        # Only server errors and timeouts mean the provider is unhealthy; 4xx answers do not open the circuit.
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  ratelimiter:
    configs:
      default:
        register-health-indicator: true
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0
    instances:
      requestsApi:
        base-config: default
